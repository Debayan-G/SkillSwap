<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">How SkillSwap works</title>
  <desc id="desc">An animated three-step loop: share a skill, teach to earn credits, then learn something new.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1100" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10091D"/><stop offset=".5" stop-color="#0A0D18"/><stop offset="1" stop-color="#061518"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
    <linearGradient id="flow" x1="350" y1="0" x2="750" y2="0"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .step { transform-box:fill-box; transform-origin:center; animation:float 4.8s ease-in-out infinite; }
    .step-two { animation-delay:-1.6s; }.step-three { animation-delay:-3.2s; }
    .flowline { stroke-dasharray:7 9; animation:flow 2.4s linear infinite; }
    .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 2.8s ease-out infinite; }
    .pulse-late { animation-delay:-1.4s; }
    .spark { animation:spark 2.2s ease-in-out infinite; }
    .spark-late { animation-delay:-1.1s; }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
    @keyframes flow { to { stroke-dashoffset:-32; } }
    @keyframes pulse { 0% { opacity:0; transform:scale(.6); } 25% { opacity:.5; } 100% { opacity:0; transform:scale(1.5); } }
    @keyframes spark { 0%,100% { opacity:.18; transform:scale(.7); } 50% { opacity:1; transform:scale(1.3); } }
    @media(prefers-reduced-motion:reduce) { .step,.flowline,.pulse,.spark { animation:none; } .motion-dot { display:none; } }
  </style>
  <rect x="1" y="1" width="1098" height="248" rx="25" fill="url(#panel)" stroke="#A78BFA" stroke-opacity=".22"/>
  <path d="M0 214c170-54 270 26 422-13s288-55 414-8 191 24 264-6" stroke="#8B5CF6" stroke-opacity=".12"/>
  <path d="M350 124h400" stroke="url(#flow)" stroke-opacity=".4" stroke-width="2"/>
  <path class="flowline" d="M350 124h400" stroke="url(#flow)" stroke-width="2"/>
  <circle class="motion-dot" r="4" fill="#C4B5FD" filter="url(#glow)"><animateMotion path="M350 124h400" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle class="motion-dot" r="3.5" fill="#67E8F9" filter="url(#glow)"><animateMotion path="M750 124H350" dur="3s" repeatCount="indefinite"/></circle>
  <g class="step step-one">
    <rect x="48" y="56" width="302" height="136" rx="19" fill="#13101F" stroke="#A78BFA" stroke-opacity=".3"/>
    <circle cx="90" cy="103" r="21" fill="#8B5CF6" fill-opacity=".16" stroke="#A78BFA" stroke-opacity=".35"/>
    <circle cx="84" cy="101" r="5" fill="#A78BFA"/><circle cx="97" cy="107" r="5" fill="#67E8F9"/>
    <path d="m87 103 7 3" stroke="#DDD6FE" stroke-width="2" stroke-linecap="round"/>
    <text x="78" y="151" fill="#F5F3FF" font-family="Arial,sans-serif" font-size="19" font-weight="700">Share a skill</text>
    <text x="78" y="174" fill="#A6A1B8" font-family="Arial,sans-serif" font-size="13">Offer what you know to your community</text>
  </g>
  <g class="step step-two">
    <rect x="399" y="56" width="302" height="136" rx="19" fill="#10121F" stroke="#8B5CF6" stroke-opacity=".35"/>
    <circle cx="441" cy="103" r="21" fill="#7C3AED" fill-opacity=".18" stroke="#A78BFA" stroke-opacity=".4"/>
    <path d="M441 91v24m-8-16h16m-14 12 6 5 6-5" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="429" y="151" fill="#F5F3FF" font-family="Arial,sans-serif" font-size="19" font-weight="700">Teach &amp; earn credits</text>
    <text x="429" y="174" fill="#A6A1B8" font-family="Arial,sans-serif" font-size="13">Get rewarded for helping someone grow</text>
  </g>
  <g class="step step-three">
    <rect x="750" y="56" width="302" height="136" rx="19" fill="#0C171D" stroke="#22D3EE" stroke-opacity=".3"/>
    <circle cx="792" cy="103" r="21" fill="#0891B2" fill-opacity=".17" stroke="#67E8F9" stroke-opacity=".4"/>
    <path d="m780 99 12-6 12 6-12 6-12-6Zm4 3v7c5 4 11 4 16 0v-7" stroke="#A5F3FC" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="780" y="151" fill="#F5F3FF" font-family="Arial,sans-serif" font-size="19" font-weight="700">Learn something new</text>
    <text x="780" y="174" fill="#A6A1B8" font-family="Arial,sans-serif" font-size="13">Spend credits on your next skill</text>
  </g>
  <circle class="pulse" cx="350" cy="124" r="10" stroke="#A78BFA" stroke-width="1.5"/>
  <circle class="pulse pulse-late" cx="750" cy="124" r="10" stroke="#67E8F9" stroke-width="1.5"/>
  <circle class="spark" cx="109" cy="37" r="2" fill="#C4B5FD"/><circle class="spark spark-late" cx="1007" cy="218" r="2" fill="#67E8F9"/>
</svg>
