<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillSwap — Learn more. Teach what you know.</title>
<link id="ss-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 10 22 22' stroke='%23A78BFA' stroke-width='2.5'/%3E%3Ccircle cx='10' cy='10' r='5' fill='%237C3AED'/%3E%3Ccircle cx='22' cy='22' r='5' fill='%2322D3EE'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    color-scheme: dark;
    --ss-bg: #05060a;
    --ss-purple: #7c3aed;
    --ss-violet: #8b5cf6;
    --ss-indigo: #6366f1;
    --ss-cyan: #22d3ee;
  }

  html,
  body {
    background:
      radial-gradient(circle at 15% 10%, rgba(124,58,237,.16), transparent 32%),
      radial-gradient(circle at 85% 15%, rgba(34,211,238,.10), transparent 30%),
      radial-gradient(circle at 50% 100%, rgba(99,102,241,.12), transparent 38%),
      var(--ss-bg);
    min-height: 100%;
  }

  body {
    font-family:'Inter',sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow-x:hidden;
  }

  .font-display{ font-family:'Space Grotesk','Inter',sans-serif; }

  /* =========================================================
     PREMIUM SKILLSWAP BACKGROUND
     ========================================================= */
  .ss-bg {
    position:fixed !important;
    inset:0 !important;
    z-index:0 !important;
    overflow:hidden;
    pointer-events:none;
    background:
      radial-gradient(ellipse 80% 70% at 50% -20%, rgba(124,58,237,.14), transparent 65%),
      radial-gradient(ellipse 60% 50% at 100% 50%, rgba(34,211,238,.07), transparent 70%),
      radial-gradient(ellipse 60% 50% at 0% 80%, rgba(139,92,246,.08), transparent 70%),
      #05060a;
  }

  .ss-bg::before {
    content:"";
    position:absolute;
    inset:-25%;
    background:
      radial-gradient(circle at 18% 18%, rgba(124,58,237,.16), transparent 20%),
      radial-gradient(circle at 82% 22%, rgba(34,211,238,.10), transparent 18%),
      radial-gradient(circle at 52% 82%, rgba(99,102,241,.10), transparent 24%);
    filter:blur(50px);
    opacity:.9;
    animation:ssAurora 16s ease-in-out infinite alternate;
  }

  .ss-orb-field { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .ss-orb { position:absolute; width:clamp(260px,38vw,620px); aspect-ratio:1; border-radius:50%; filter:blur(42px); opacity:.34; will-change:transform; animation:ssOrbJourney 26s ease-in-out infinite alternate; }
  .ss-orb-violet { left:-17%; top:-24%; background:radial-gradient(circle at 45% 45%,rgba(139,92,246,.62),rgba(124,58,237,.18) 36%,transparent 70%); }
  .ss-orb-cyan { right:-19%; top:16%; width:clamp(240px,34vw,540px); background:radial-gradient(circle at 45% 45%,rgba(34,211,238,.48),rgba(8,145,178,.16) 38%,transparent 72%); animation-duration:32s; animation-direction:alternate-reverse; }
  .ss-orb-indigo { left:30%; bottom:-45%; width:clamp(300px,44vw,700px); background:radial-gradient(circle at 50% 45%,rgba(99,102,241,.42),rgba(79,70,229,.14) 38%,transparent 72%); animation-duration:38s; }
  @keyframes ssOrbJourney { 0%{transform:translate3d(-3vw,-2vh,0) scale(.92)} 50%{transform:translate3d(4vw,5vh,0) scale(1.08)} 100%{transform:translate3d(-1vw,8vh,0) scale(.98)} }

  .ss-bg::after {
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(310px circle at var(--pointer-x,50%) var(--pointer-y,35%), rgba(124,58,237,.075), transparent 78%),
      linear-gradient(to bottom, rgba(5,6,10,0) 0%, rgba(5,6,10,.12) 55%, rgba(5,6,10,.45) 100%),
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.28) 100%);
  }
  @media(max-width:640px){
    .ss-bg::before { filter:blur(30px); }
    .ss-orb { filter:blur(28px); }
    .ss-glow { filter:blur(22px); }
  }

  @keyframes ssAurora {
    0%   { transform:translate3d(-1%,0,0) scale(1); }
    50%  { transform:translate3d(1.5%,-1%,0) scale(1.06); }
    100% { transform:translate3d(-.5%,1%,0) scale(1.02); }
  }

  .ss-grid {
    position:absolute !important;
    inset:-20% !important;
    background-image:
      linear-gradient(rgba(139,92,246,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.045) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.65;
    -webkit-mask-image:radial-gradient(ellipse 80% 75% at 50% 40%, black 20%, transparent 82%);
    mask-image:radial-gradient(ellipse 80% 75% at 50% 40%, black 20%, transparent 82%);
    animation:gridDrift 45s linear infinite;
  }

  @keyframes gridDrift {
    0% { transform:translate3d(0,0,0); }
    100% { transform:translate3d(64px,64px,0); }
  }

  .ss-glow {
    position:absolute !important;
    inset:-20% !important;
    background:
      radial-gradient(circle at 25% 20%, rgba(124,58,237,.18), transparent 24%),
      radial-gradient(circle at 75% 25%, rgba(34,211,238,.12), transparent 22%),
      radial-gradient(circle at 50% 75%, rgba(99,102,241,.10), transparent 28%);
    filter:blur(35px);
    opacity:.85;
    animation:ssAmbient 12s ease-in-out infinite alternate;
  }

  @keyframes ssAmbient {
    0% { transform:scale(1) translate3d(0,0,0); }
    50% { transform:scale(1.06) translate3d(1%,-1%,0); }
    100% { transform:scale(1.02) translate3d(-1%,1%,0); }
  }

  .ss-dots { position:absolute !important; inset:0 !important; opacity:.8; }

  .ss-dot {
    position:absolute;
    width:3px !important;
    height:3px !important;
    border-radius:50%;
    background:#a78bfa;
    box-shadow:0 0 8px rgba(167,139,250,.8), 0 0 20px rgba(124,58,237,.35);
    animation:ssFloat 8s ease-in-out infinite, ssPulse 4s ease-in-out infinite;
  }

  @keyframes ssFloat {
    0%,100% { transform:translate3d(0,0,0); }
    50% { transform:translate3d(8px,-18px,0); }
  }

  @keyframes ssPulse {
    0%,100% { opacity:.35; }
    50% { opacity:.9; }
  }

  .ss-hero > * { opacity:0; }
  .ss-hero.is-intro-revealed > * { animation:ssRise .72s cubic-bezier(.2,.7,.2,1) both; }
  .ss-hero.is-intro-revealed > *:nth-child(1) { animation-delay:0s; }
  .ss-hero.is-intro-revealed > *:nth-child(2) { animation-delay:.26s; }
  .ss-hero.is-intro-revealed > *:nth-child(3) { animation-delay:1.05s; }
  .ss-hero.is-intro-revealed > *:nth-child(4) { animation-delay:1.35s; }
  .ss-hero.is-intro-revealed > *:nth-child(5) { animation-delay:1.62s; }
  .ss-hero h1 > span { display:inline-block; }
  .ss-type-char { display:inline-block; opacity:0; transform:translateY(.24em); animation:ssTypeChar .34s cubic-bezier(.16,1,.3,1) forwards; animation-delay:var(--char-delay); }
  .ss-title-accent .ss-type-char { background:linear-gradient(100deg,#fff 12%,#c4b5fd 54%,#67e8f9 100%); color:transparent; background-clip:text; -webkit-background-clip:text; }
  @keyframes ssTypeChar { to { opacity:1; transform:translateY(0); } }
  @keyframes ssRise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
  .ss-orbit-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:1; opacity:.54; pointer-events:none; mix-blend-mode:screen; }
  @media(max-width:640px) { .ss-orbit-canvas { opacity:.32; } }
  .ss-reveal { opacity:0; transform:translateY(22px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .ss-reveal.is-visible { opacity:1; transform:translateY(0); }
  .ss-reveal.is-visible:nth-child(2) { transition-delay:.08s; }
  .ss-reveal.is-visible:nth-child(3) { transition-delay:.16s; }
  .ss-reveal.is-visible:nth-child(4) { transition-delay:.24s; }

  /* Keep application content above the background layer. */
  #app { position:relative; z-index:1; }

  @keyframes toastIn{ from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  .toast-in{ animation:toastIn .22s ease-out; }
  @keyframes modalFade{ from{opacity:0;} to{opacity:1;} }
  .modal-fade{ animation:modalFade .15s ease-out; }
  @keyframes modalPop{ from{opacity:0; transform:scale(.97) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal-pop{ animation:modalPop .18s cubic-bezier(.16,1,.3,1); }

  ::selection{ background:rgba(124,58,237,.45); color:#fff; }
  *{ scrollbar-width:none; }
  *::-webkit-scrollbar{ display:none; width:0; height:0; }
  input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator{ filter:invert(1); opacity:.5; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid rgba(167,139,250,.6); outline-offset:2px; }
  .line-clamp-2{ display:-webkit-box; line-clamp:2; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* =========================================================
     GLASS CARDS
     ========================================================= */
  .ss-card {
    border-radius:1rem;
    border:1px solid rgba(255,255,255,.09);
    background:linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    box-shadow:0 20px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.025);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .ss-auth-shell .ss-card { background:transparent !important; border-color:transparent !important; box-shadow:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }

  .ss-card-hover {
    transition:transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }

  .ss-card-hover:hover {
    transform:translateY(-3px);
    border-color:rgba(167,139,250,.25);
    background:linear-gradient(135deg, rgba(124,58,237,.07), rgba(34,211,238,.025));
    box-shadow:0 25px 70px rgba(0,0,0,.4), 0 0 35px rgba(124,58,237,.06);
  }
  @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference) {
    .ss-tilt { transform-style:preserve-3d; will-change:transform; }
    .ss-tilt:hover { transform:perspective(900px) rotateX(var(--tilt-y,0deg)) rotateY(var(--tilt-x,0deg)) translateY(-4px); }
  }
  .ss-intro { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at 50% 45%,rgba(91,33,182,.32),transparent 42%),radial-gradient(ellipse at 82% 24%,rgba(8,145,178,.2),transparent 36%),#05060a; will-change:opacity; }
  .ss-intro::before { content:""; position:absolute; z-index:-1; width:min(72vw,680px); aspect-ratio:1; border:1px solid rgba(167,139,250,.2); border-radius:50%; box-shadow:0 0 120px rgba(124,58,237,.2),inset 0 0 100px rgba(34,211,238,.06); animation:ssIntroOrbit 9s linear infinite; }
  .ss-intro::after { content:""; position:absolute; z-index:-1; width:min(105vw,1100px); aspect-ratio:1; border:1px solid rgba(34,211,238,.08); border-radius:50%; box-shadow:0 0 0 42px rgba(167,139,250,.018),0 0 0 84px rgba(34,211,238,.014); animation:ssIntroOrbit 16s linear infinite reverse; }
  .ss-intro-tunnel { position:absolute; z-index:-1; left:50%; top:50%; width:min(46vw,460px); aspect-ratio:1; border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.08); background:repeating-radial-gradient(circle,transparent 0 28px,rgba(167,139,250,.18) 29px 30px,transparent 31px 56px),conic-gradient(from 20deg,transparent,rgba(124,58,237,.22),transparent 28%,rgba(34,211,238,.18),transparent 62%,rgba(167,139,250,.2),transparent); box-shadow:0 0 70px rgba(124,58,237,.2),inset 0 0 50px rgba(34,211,238,.12); mask-image:radial-gradient(circle,transparent 0 13%,#000 18% 72%,transparent 78%); will-change:transform,opacity; }
  .ss-intro-flash { position:absolute; inset:0; z-index:-1; opacity:0; background:radial-gradient(ellipse at center,rgba(255,255,255,.72),rgba(167,139,250,.32) 12%,rgba(5,6,10,0) 54%); pointer-events:none; }
  .ss-intro-brand { position:fixed; left:50%; top:50%; display:flex; align-items:center; gap:.18em; white-space:nowrap; transform:translate(-50%,-50%); transform-origin:center; font-family:'Space Grotesk','Inter',sans-serif; font-size:clamp(4rem,12vw,8rem); font-weight:700; letter-spacing:-.075em; color:#fff; text-shadow:0 0 60px rgba(167,139,250,.32); will-change:transform,opacity,filter; }
  .ss-intro-brand svg { width:.8em; height:.8em; flex:none; }
  .ss-intro-brand span { font-size:1em; font-weight:700; line-height:1; letter-spacing:-.075em; }
  .ss-intro-caption { position:absolute; top:calc(50% + clamp(4.6rem,14vw,9rem)); color:rgba(255,255,255,.54); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; animation:ssCaptionIn .8s .42s both; }
  .ss-intro-caption::before { content:""; display:inline-block; width:20px; height:1px; margin:0 10px 3px 0; background:linear-gradient(90deg,#8b5cf6,#22d3ee); box-shadow:0 0 12px rgba(139,92,246,.8); }
  .ss-login-transition { position:fixed; inset:0; z-index:10001; display:grid; place-items:center; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at center,rgba(54,35,115,.38),transparent 48%),#05060a; color:white; }
  .ss-login-portal { position:absolute; left:50%; top:50%; width:min(48vw,480px); aspect-ratio:1; border:1px solid rgba(196,181,253,.45); border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.12); background:repeating-radial-gradient(circle,transparent 0 34px,rgba(167,139,250,.22) 35px 36px,transparent 37px 70px),conic-gradient(from 0deg,transparent,rgba(124,58,237,.34),transparent 36%,rgba(34,211,238,.3),transparent 68%,rgba(167,139,250,.28),transparent); box-shadow:0 0 60px rgba(124,58,237,.28),inset 0 0 65px rgba(34,211,238,.15); mask-image:radial-gradient(circle,transparent 0 12%,#000 19% 73%,transparent 82%); will-change:transform,opacity; }
  .ss-login-portal.is-open { animation:ssLoginPortalOpen 1s .12s cubic-bezier(.16,1,.3,1) both; }
  .ss-login-ripple { position:absolute; left:50%; top:50%; width:min(30vw,300px); aspect-ratio:1; border:1px solid rgba(103,232,249,.65); border-radius:50%; opacity:0; transform:translate(-50%,-50%) scale(.25,.18); }
  .ss-login-ripple.is-rippling { animation:ssWaterRipple 1.15s cubic-bezier(.12,.65,.22,1) both; }
  .ss-login-ripple:nth-child(2).is-rippling { animation-delay:.12s; }
  .ss-login-ripple:nth-child(3).is-rippling { animation-delay:.24s; }
  .ss-login-message { position:relative; z-index:1; max-width:min(90vw,820px); text-align:center; font-family:'Space Grotesk','Inter',sans-serif; font-size:clamp(1.7rem,5vw,3.6rem); line-height:1.15; font-weight:600; letter-spacing:-.04em; text-shadow:0 0 36px rgba(167,139,250,.38); }
  .ss-login-char { display:inline-block; opacity:0; transform:translateY(.35em); animation:ssLoginType .38s cubic-bezier(.16,1,.3,1) forwards; animation-delay:var(--login-char-delay); }
  @keyframes ssLoginType { to { opacity:1; transform:translateY(0); } }
  @keyframes ssLoginPortalOpen { 0% { opacity:0; transform:translate(-50%,-50%) scale(.12) rotate(-20deg); } 45% { opacity:1; } 100% { opacity:.7; transform:translate(-50%,-50%) scale(1.5) rotate(36deg); } }
  @keyframes ssWaterRipple { 0% { opacity:0; transform:translate(-50%,-50%) scale(.2,.12); } 12% { opacity:.85; } 100% { opacity:0; transform:translate(-50%,-50%) scale(3.2,2.1); } }
  @keyframes ssIntroOrbit { to { transform:rotate(360deg); } }
  @keyframes ssCaptionIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .ss-public-header > div > button:first-child { transition:transform .2s ease, filter .2s ease; }
  .ss-public-header > div > button:first-child:hover { transform:translateY(-1px); filter:drop-shadow(0 0 12px rgba(139,92,246,.45)); }
  .ss-public-header { border-image:linear-gradient(90deg,transparent,rgba(167,139,250,.24),rgba(34,211,238,.18),transparent) 1; }
  header.ss-public-header { background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border-bottom:0 !important; box-shadow:none; }
  .ss-hero h1 { text-shadow:0 8px 50px rgba(124,58,237,.15); }
  .ss-title-accent { background:linear-gradient(100deg,#fff 12%,#c4b5fd 54%,#67e8f9 100%); color:transparent; background-clip:text; -webkit-background-clip:text; }

  .ss-input {
    width:100%;
    border-radius:.5rem;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);
    padding:.625rem .875rem;
    font-size:.875rem;
    color:#fff;
    outline:none;
    transition:border-color .15s, background .15s, box-shadow .15s;
  }

  .ss-input::placeholder{ color:rgba(255,255,255,.3); }
  .ss-input:focus{ border-color:rgba(167,139,250,.5); background:rgba(255,255,255,.065); box-shadow:0 0 0 3px rgba(124,58,237,.08); }

  .ss-btn{ display:inline-flex; align-items:center; justify-content:center; gap:.5rem; font-weight:500; border-radius:.5rem; transition:all .15s; white-space:nowrap; cursor:pointer; }
  .ss-btn:disabled{ opacity:.4; pointer-events:none; }
  .ss-btn-primary{ background:linear-gradient(110deg,#7c3aed,#6366f1 60%,#4f46e5); color:#fff; box-shadow:0 10px 30px rgba(124,58,237,.25), 0 0 0 1px rgba(167,139,250,.08) inset; }
  .ss-btn-primary:hover{ filter:brightness(1.08); box-shadow:0 12px 35px rgba(124,58,237,.38), 0 0 25px rgba(124,58,237,.12); }
  .ss-btn-secondary{ background:rgba(255,255,255,.06); color:#fff; border:1px solid rgba(255,255,255,.1); }
  .ss-btn-secondary:hover{ background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); }
  .ss-btn-ghost{ color:rgba(255,255,255,.7); }
  .ss-btn-ghost:hover{ color:#fff; background:rgba(255,255,255,.06); }
  .ss-btn-danger{ background:rgba(244,63,94,.1); color:#fb7185; border:1px solid rgba(244,63,94,.2); }
  .ss-btn-danger:hover{ background:rgba(244,63,94,.15); }
  .ss-badge{ display:inline-flex; align-items:center; gap:.25rem; border-radius:9999px; border:1px solid; padding:.125rem .625rem; font-size:11px; font-weight:500; }
  .toggle{ width:2.5rem; height:1.5rem; border-radius:9999px; position:relative; transition:background .15s; }
  .toggle-knob{ position:absolute; top:2px; left:2px; height:1.25rem; width:1.25rem; border-radius:9999px; background:#fff; transition:transform .15s; }

  /* =========================================================
     APP CHROME
     ========================================================= */
  header {
    background:linear-gradient(180deg, rgba(5,6,10,.94), rgba(5,6,10,.76)) !important;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 10px 40px rgba(0,0,0,.18);
  }
  .ss-app-sidebar { position:relative; isolation:isolate; border-right:0 !important; background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:none; }
  .ss-app-sidebar::before { content:none; }
  .ss-app-sidebar::after { content:none; }
  header.ss-app-topbar { position:sticky; isolation:isolate; border-bottom:0 !important; background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:none; }
  header.ss-app-topbar::before { content:none; }
  .ss-mobile-nav { border-top:0 !important; background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; box-shadow:none; }
  .ss-mobile-drawer { border-right:0 !important; background:transparent !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }

  @media (prefers-reduced-motion: reduce) {
    .ss-grid,
    .ss-glow,
    .ss-bg::before,
    .ss-orb,
    .ss-dot,
    .ss-card-hover,
    .ss-hero > *,
    .ss-type-char,
    .ss-reveal,
    .ss-intro::before,
    .toast-in,
    .modal-pop,
    .modal-fade {
      animation:none !important;
      transition:none !important;
    }
    .ss-hero > *, .ss-type-char, .ss-reveal { opacity:1 !important; filter:none !important; transform:none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host" class="fixed bottom-4 right-4 z-[200] flex flex-col gap-2 w-[min(360px,calc(100vw-2rem))]"></div>
<div id="modal-root"></div>
<script>
/* ============================================================================
   SKILLSWAP — Supabase accounts; demo app data persisted in localStorage.
============================================================================ */

/* ---------------------------------- UTIL ---------------------------------- */
const uid = (p="id") => `${p}_${Math.random().toString(36).slice(2,10)}`;
const nowISO = () => new Date().toISOString();
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 10) return "just now";
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s/60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60); if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24); if (d < 7) return `${d}d ago`;
  const w = Math.floor(d/7); if (w < 5) return `${w}w ago`;
  return new Date(iso).toLocaleDateString();
}

async function syncProfile(user){
  const { data, error } = await ssClient.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(error) throw error;
  const profile = data || { id:user.id, email:user.email, name:user.user_metadata.name || "", username:(user.user_metadata.name || "student").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,14) + Math.floor(Math.random()*900+100), mobile:"", university:"", avatar_color:"#7C3AED", about:"", teach_skills:[], learn_skills:[], credits:100, created_at:nowISO() };
  if(!data){ const { error:saveError } = await ssClient.from("profiles").insert(profile); if(saveError) throw saveError; }
  const local = { id:user.id, email:user.email, name:profile.name, username:profile.username, mobile:profile.mobile||"", university:profile.university||"", avatarColor:profile.avatar_color||"#7C3AED", about:profile.about||"", teachSkills:profile.teach_skills||[], learnSkills:profile.learn_skills||[], credits:profile.credits??100, rating:"—", sessionsTaught:0, sessionsLearned:0, streak:0, createdAt:profile.created_at||nowISO() };
  const index=DB.users.findIndex(u=>u.id===user.id); if(index<0) DB.users.push(local); else DB.users[index]={...DB.users[index],...local};
  DB.currentUserId=user.id;
  const {data:accountData,error:accountError}=await ssClient.from("account_data").select("data").eq("user_id",user.id).maybeSingle();
  if(accountError) throw accountError;
  if(accountData?.data){ DB=accountData.data; DB.currentUserId=user.id; }
  const restoredUser=DB.users.findIndex(u=>u.id===user.id);
  if(restoredUser<0) DB.users.push(local); else DB.users[restoredUser]={...DB.users[restoredUser],...local};
  CLOUD_READY=true; render();
}

/* ================================ ROUTER DISPATCH ============================= */
function Router(){
  const { parts } = parseHash();
  const path = parts[0] || "";
  const PUBLIC_ONLY = ["login","signup"];
  const PROTECTED = ["dashboard","onboarding","discover","skills","teach","my-skills","sessions","credits","leaderboard","community","messages","notifications","settings"];
  const cu = currentUser();

  if (PROTECTED.includes(path) && !cu) return LoginPage();
  if (PUBLIC_ONLY.includes(path) && cu) { nav("dashboard"); return ""; }

  switch(path){
    case "": return LandingPage();
    case "login": return LoginPage();
    case "signup": return SignupPage();
    case "onboarding": return OnboardingPage();
    case "dashboard": return AppLayout(DashboardPage());
    case "discover": return AppLayout(DiscoverPage());
    case "skills": return AppLayout(SkillDetailPage(parts[1]));
    case "teach": return AppLayout(TeachPage());
    case "my-skills": return AppLayout(MySkillsPage());
    case "sessions": return AppLayout(SessionsPage());
    case "credits": return AppLayout(CreditsPage());
    case "leaderboard": return AppLayout(LeaderboardPage());
    case "community": return AppLayout(CommunityPage());
    case "messages": return AppLayout(MessagesPage(parts[1]));
    case "notifications": return AppLayout(NotificationsPage());
    case "profile": return cu ? AppLayout(ProfilePage(parts[1])) : PublicShell(ProfilePage(parts[1]));
    case "settings": return AppLayout(SettingsPage());
    default: return NotFoundPage();
  }
}

let REVEAL_OBSERVER, ASCII_CANVAS=null, ASCII_CONTEXT=null, ASCII_FRAME=0, ASCII_SIZE="", ASCII_LAST_DRAW=0;
const WAVE_MOUSE={x:0,y:0,originX:0,originY:0,energy:0,lastImpulse:0};
function drawOceanWaves(ctx,w,h,time){
  const phase=time*.00082, age=time-WAVE_MOUSE.lastImpulse;
  const energy=WAVE_MOUSE.energy*Math.exp(-Math.max(age,0)/1050);
  ctx.save(); ctx.lineWidth=1.1; ctx.lineJoin="round"; ctx.lineCap="round";
  for(let offset=-h;offset<w;offset+=62){
    ctx.beginPath(); let started=false;
    for(let x=-h;x<=w+h;x+=24){
      const base=x+offset, along=x+base;
      const swell=Math.sin(along*.009-phase)*27+Math.sin(along*.021-phase*1.55)*10+Math.sin(along*.0038-phase*.52)*17;
      let ripple=0;
      if(energy>.015){ const dx=x-WAVE_MOUSE.originX,dy=base-WAVE_MOUSE.originY,dist=Math.hypot(dx,dy); if(dist<650) ripple=energy*Math.sin(dist*.052-age*.022)*Math.exp(-dist/270)*42; }
      const y=base+swell+ripple;
      if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
    }
    const crest=Math.abs(Math.round(offset/62))%3===0;
    ctx.strokeStyle=crest?"rgba(196,181,253,.5)":"rgba(139,92,246,.32)";
    ctx.globalAlpha=crest?.78:.62;
    ctx.stroke();
  }
  ctx.restore();
}
function drawAsciiOrbit(time=0){
  const canvas=ASCII_CANVAS, ctx=ASCII_CONTEXT;
  if(!canvas || !ctx || !canvas.isConnected) return;
  const rect=canvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,1);
  const size=`${Math.round(rect.width*dpr)}x${Math.round(rect.height*dpr)}@${dpr}`;
  if(size!==ASCII_SIZE){ canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr); ASCII_SIZE=size; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,rect.width,rect.height);
  const w=rect.width,h=rect.height,r=Math.min(w*.3,h*.36,360),cx=w*.75,cy=h*.48,angle=time*Math.PI*2/48000;
  drawOceanWaves(ctx,w,h,time);
  const cos=Math.cos(angle),sin=Math.sin(angle),glyphs=" .:-=+*#%@";
  ctx.font="10px 'Courier New',monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let y=-r;y<=r;y+=18) for(let x=-r;x<=r;x+=15){
    const nx=x/r,ny=y/r,d=nx*nx+ny*ny; if(d>=1) continue;
    const nz=Math.sqrt(1-d),rx=nx*cos-nz*sin,rz=nx*sin+nz*cos;
    const light=Math.max(0,-rx*.32-ny*.2+rz*.92);
    const bands=.5+.5*Math.sin(Math.asin(ny)*17+angle*.5);
    const texture=.5+.5*Math.sin(Math.atan2(rx,rz)*18+ny*23+angle*1.7);
    const shade=light*.57+bands*.2+texture*.2; if(shade<.1) continue;
    const glyph=glyphs[Math.min(glyphs.length-1,Math.floor(shade*(glyphs.length-1)))];
    ctx.fillStyle=rx>.18?`rgba(103,232,249,${.3+shade*.46})`:`rgba(196,181,253,${.3+shade*.46})`;
    ctx.fillText(glyph,cx+x,cy+y);
  }
}
function animateAsciiOrbit(time){
  if(!ASCII_CANVAS || !ASCII_CANVAS.isConnected){ ASCII_FRAME=0; return; }
  const frameInterval=window.innerWidth<640?110:80;
  if(time-ASCII_LAST_DRAW>=frameInterval){ drawAsciiOrbit(time); ASCII_LAST_DRAW=time; }
  ASCII_FRAME=requestAnimationFrame(animateAsciiOrbit);
}
function initAsciiOrbit(){
  const canvas=document.querySelector(".ss-orbit-canvas");
  if(canvas!==ASCII_CANVAS){ ASCII_CANVAS=canvas; ASCII_CONTEXT=canvas?.getContext("2d")||null; ASCII_SIZE=""; }
  if(!canvas || !ASCII_CONTEXT) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ drawAsciiOrbit(0); return; }
  if(!ASCII_FRAME) ASCII_FRAME=requestAnimationFrame(animateAsciiOrbit);
}
function render(){
  saveDB();
  document.getElementById("app").innerHTML = Router();
  icons();
  renderToasts();
  renderModals();
  afterRender();
  initAsciiOrbit();
}
function afterRender(){
  if(REVEAL_OBSERVER) REVEAL_OBSERVER.disconnect();
  const pending=document.querySelectorAll(".ss-reveal:not(.is-visible)");
  if(!pending.length) return;
  if(!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    pending.forEach(el=>el.classList.add("is-visible")); return;
  }
  REVEAL_OBSERVER=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(entry.isIntersecting){ entry.target.classList.add("is-visible"); REVEAL_OBSERVER.unobserve(entry.target); }
  }),{threshold:.12});
  pending.forEach(el=>REVEAL_OBSERVER.observe(el));
  document.querySelectorAll(".ss-reveal .ss-card-hover").forEach(el=>el.classList.add("ss-tilt"));
}

async function submitLogin(e){
  e.preventDefault();
  const f = UI.loginForm; f.error="";
  if (!f.email || !f.password){ f.error="Enter your email and password."; render(); return false; }
  if(!ssClient){ f.error="Connect Supabase first. See Skillswap/SUPABASE_SETUP.md."; render(); return false; }
  f.loading=true; render();
  const {data,error}=await ssClient.auth.signInWithPassword({email:f.email.trim(),password:f.password});
  if(error){ f.loading=false; f.error=error.message; render(); return false; }
  try{ await syncProfile(data.user); }
  catch(err){ f.loading=false; f.error="Signed in, but profile could not load: "+err.message; render(); return false; }
  const welcomeName=data.user.user_metadata.name||data.user.email;
  UI.loginForm = { email:"", password:"", error:"", loading:false };
  await playLoginPortalTransition();
  toast(`Welcome back, ${welcomeName}.`);
  return false;
}
async function playLoginPortalTransition(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ nav("dashboard"); return; }
  const overlay=document.createElement("div"); overlay.className="ss-login-transition";
  const messageText="Every new skill begins with showing up.";
  const chars=Array.from(messageText).map((char,index)=>`<span class="ss-login-char" style="--login-char-delay:${index*22}ms">${char===" "?"&nbsp;":esc(char)}</span>`).join("");

async function submitSignup(e){
  e.preventDefault();
  const f = UI.signupForm; f.error="";
  if (!f.name.trim()){ f.error="Full name is required."; render(); return false; }
  if (!/^\S+@\S+\.\S+$/.test(f.email)){ f.error="Enter a valid email address."; render(); return false; }
  if (f.password.length < 8){ f.error="Password must be at least 8 characters."; render(); return false; }
  if(!ssClient){ f.error="Connect Supabase first. See Skillswap/SUPABASE_SETUP.md."; render(); return false; }
  f.loading=true; render();
  const {data,error}=await ssClient.auth.signUp({email:f.email.trim(),password:f.password,options:{data:{name:f.name.trim(),mobile:f.mobile,university:f.university}}});
  if(error){ f.loading=false; f.error=error.message; render(); return false; }
  if(data.session){
    try{ await syncProfile(data.user); }
    catch(err){ f.loading=false; f.error="Account created, but profile could not be saved: "+err.message; render(); return false; }
    DB.transactions.unshift({id:uid("tx"),userId:data.user.id,amount:100,type:"WELCOME_BONUS",description:"Welcome to SkillSwap",createdAt:nowISO()});
    DB.notifications.unshift({id:uid("ntf"),userId:data.user.id,text:"You received 100 Skill Credits. Welcome to SkillSwap!",type:"credit",read:false,createdAt:nowISO()});
    toast("Account created — 100 Skill Credits added.");
  } else { toast("Check your email to confirm your account, then log in.","info"); UI.signupForm = { name:"", email:"", password:"", mobile:"", university:"", error:"", loading:false }; nav("login"); return false; }
  UI.signupForm = { name:"", email:"", password:"", mobile:"", university:"", error:"", loading:false };
  nav("onboarding");
  return false;
}

function DiscoverPage(){
  const cu = currentUser(); const f = UI.discover;
  const { params } = parseHash();
  if (params.get("skill") && !f._appliedSkill){ f.search = params.get("skill"); f._appliedSkill = true; }
  if (params.get("category") && !f._appliedCat){ f.category = params.get("category"); f._appliedCat = true; }

  let r = DB.skills.filter(s=>s.active!==false && s.teacherId!==cu.id);
  if (f.search){ const q=f.search.toLowerCase(); r = r.filter(s=>s.name.toLowerCase().includes(q) || DB.users.find(u=>u.id===s.teacherId)?.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q)); }
  if (f.category) r = r.filter(s=>s.category===f.category);
  if (f.level) r = r.filter(s=>s.level===f.level);
  if (f.format) r = r.filter(s=>s.format===f.format);
  r = r.filter(s=>s.price<=f.maxCredits);
  r = r.filter(s=>parseFloat(s.rating)>=f.minRating || s.rating==="New");
  switch(f.sort){
    case "Popular": r = [...r].sort((a,b)=>b.studentsCount-a.studentsCount); break;
    case "Highest Rated": r = [...r].sort((a,b)=>parseFloat(b.rating||0)-parseFloat(a.rating||0)); break;
    case "Lowest Credits": r = [...r].sort((a,b)=>a.price-b.price); break;
    case "Newest": r = [...r].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); break;
  }
  return `<div class="space-y-6">
    <div><h1 class="font-display text-2xl sm:text-[28px] font-semibold">Discover your next skill</h1><p class="text-white/45 text-sm mt-1">${DB.skills.length} skills from ${DB.users.length} students, ready to teach.</p></div>
    <div class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1"><i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-white/35"></i>
        <input value="${esc(f.search)}" oninput="UI.discover.search=this.value; render()" placeholder="Search skills, topics, or teachers..." class="ss-input pl-10"/></div>
      ${btn({label:"Filters", variant:"secondary", icon:"sliders-horizontal", onclick:"UI.discover.showFilters=!UI.discover.showFilters; render()"})}
      <select onchange="UI.discover.sort=this.value; render()" class="ss-input sm:w-48">${["Recommended","Popular","Highest Rated","Lowest Credits","Newest"].map(s=>`<option ${f.sort===s?"selected":""}>${s}</option>`).join("")}</select>
    </div>
    ${f.showFilters?`<div class="ss-card p-5 grid sm:grid-cols-2 lg:grid-cols-5 gap-4">
      ${fieldHTML("Category", `<select onchange="UI.discover.category=this.value; render()" class="ss-input"><option value="">All</option>${CATEGORIES.map(c=>`<option ${f.category===c?"selected":""}>${c}</option>`).join("")}</select>`)}
      ${fieldHTML("Level", `<select onchange="UI.discover.level=this.value; render()" class="ss-input"><option value="">Any</option>${["Beginner","Intermediate","Advanced"].map(l=>`<option ${f.level===l?"selected":""}>${l}</option>`).join("")}</select>`)}
      ${fieldHTML("Format", `<select onchange="UI.discover.format=this.value; render()" class="ss-input"><option value="">Any</option><option ${f.format==="1-on-1"?"selected":""}>1-on-1</option><option ${f.format==="Small group"?"selected":""}>Small group</option></select>`)}
      ${fieldHTML(`Max credits: ${f.maxCredits}`, `<input type="range" min="10" max="100" value="${f.maxCredits}" oninput="UI.discover.maxCredits=+this.value; render()" class="w-full accent-violet-500"/>`)}
      ${fieldHTML(`Min rating: ${f.minRating}`, `<input type="range" min="0" max="5" step="0.5" value="${f.minRating}" oninput="UI.discover.minRating=+this.value; render()" class="w-full accent-violet-500"/>`)}
    </div>`:""}
    <div class="flex gap-2 flex-wrap">${CATEGORIES.map(c=>`<button onclick="UI.discover.category=UI.discover.category==='${c}'?'':'${c}'; render()" class="px-3 py-1.5 rounded-full text-xs border transition-colors ${f.category===c?"bg-violet-500/20 border-violet-400/50 text-white":"border-white/10 text-white/50 hover:border-white/25"}">${c}</button>`).join("")}</div>
    ${r.length===0?emptyState("search","No skills match your search","Try a different keyword, or clear your filters to see everything available.", btn({label:"Clear filters", size:"sm", onclick:"UI.discover={search:'',category:'',level:'',maxCredits:100,minRating:0,format:'',sort:'Recommended',showFilters:false}; render()"}))
      : `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${r.map(skillCardHTML).join("")}</div>`}
  </div>`;
}

      <div class="ss-card p-4 space-y-2">
        <h4 class="text-xs font-semibold text-white/50 uppercase tracking-wide mb-1">Booking summary</h4>
        <div class="flex justify-between text-sm"><span class="text-white/50">Skill</span><span>${esc(skill.name)}</span></div>
        <div class="flex justify-between text-sm"><span class="text-white/50">Teacher</span><span>${esc(teacher.name)}</span></div>
        <div class="flex justify-between text-sm"><span class="text-white/50">Duration</span><span>${skill.duration} minutes</span></div>
        <div class="flex justify-between text-sm"><span class="text-white/50">Cost</span><span class="text-cyan-300">${skill.price} Skill Credits</span></div>
        <div class="h-px bg-white/[0.08] my-1"></div>
        <div class="flex justify-between text-sm"><span class="text-white/50">Current balance</span><span>${cu.credits} Skill Credits</span></div>

function confirmBooking(){
  const cu = currentUser(); const skill = DB.skills.find(s=>s.id===UI.book.skillId);
  if (!skill || cu.credits < skill.price) return;
  const booking = { id:uid("bk"), skillId:skill.id, teacherId:skill.teacherId, studentId:cu.id, date:UI.book.date, time:UI.book.time, duration:skill.duration, credits:skill.price, status:"upcoming", createdAt:nowISO() };
  DB.bookings.unshift(booking);
  cu.credits -= skill.price;
  DB.transactions.unshift({ id:uid("tx"), userId:cu.id, amount:-skill.price, type:"SESSION_PAYMENT", description:`${skill.name} learning session`, bookingId:booking.id, createdAt:nowISO() });
  DB.notifications.unshift({ id:uid("ntf"), userId:cu.id, text:`Session booked: ${skill.name} on ${UI.book.date} at ${UI.book.time}.`, type:"booking", read:false, createdAt:nowISO() });
  DB.notifications.unshift({ id:uid("ntf"), userId:skill.teacherId, text:`${cu.name} booked your ${skill.name} session.`, type:"booking", read:false, createdAt:nowISO() });
  toast("Session booked! Credits deducted.");
  UI.book.step = "success";
  render();
}

function cancelBooking(id){
  const booking = DB.bookings.find(b=>b.id===id); if (!booking) return;
  booking.status = "cancelled";
  const student = DB.users.find(u=>u.id===booking.studentId); student.credits += booking.credits;
  DB.transactions.unshift({ id:uid("tx"), userId:booking.studentId, amount:booking.credits, type:"REFUND", description:"Session cancelled — credits refunded", bookingId:id, createdAt:nowISO() });
  DB.notifications.unshift({ id:uid("ntf"), userId:booking.studentId, text:"Your session was cancelled and credits were refunded.", type:"session", read:false, createdAt:nowISO() });
  toast("Session cancelled — credits refunded."); render();
}
function completeBooking(id){
  const booking = DB.bookings.find(b=>b.id===id); if (!booking) return;
  const skill = DB.skills.find(s=>s.id===booking.skillId);
  booking.status = "completed";
  const teacher = DB.users.find(u=>u.id===booking.teacherId); const student = DB.users.find(u=>u.id===booking.studentId);
  teacher.credits += booking.credits; teacher.sessionsTaught += 1;
  student.sessionsLearned += 1; student.streak += 1;
  DB.transactions.unshift({ id:uid("tx"), userId:booking.teacherId, amount:booking.credits, type:"TEACHING_REWARD", description:`${skill?.name||"Session"} teaching session`, bookingId:id, createdAt:nowISO() });
  DB.notifications.unshift({ id:uid("ntf"), userId:booking.teacherId, text:`You received ${booking.credits} Skill Credits for teaching ${skill?.name||"a session"}.`, type:"credit", read:false, createdAt:nowISO() });
  checkAchievements(booking.teacherId); checkAchievements(booking.studentId);
  toast("Session marked complete."); render();
}

function MessagesPage(otherId){
  const cu = currentUser();
  const myConvos = DB.conversations.filter(c=>c.members.includes(cu.id)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));

  if (otherId){
    const existing = myConvos.find(c=>c.members.includes(otherId));
    UI.messagesActiveId = existing ? existing.id : "new:"+otherId;
  } else if (!UI.messagesActiveId && myConvos.length){ UI.messagesActiveId = myConvos[0].id; }

  if (myConvos.length===0 && !otherId){
    return emptyState("message-square","No conversations yet","Message a teacher after booking a session, or reach out from their profile.", btn({label:"Discover Skills", size:"sm", onclick:"nav('discover')"}));
  }
  const activeId = UI.messagesActiveId;
  const isNew = activeId && activeId.startsWith("new:");
  const otherUserId = isNew ? activeId.split(":")[1] : myConvos.find(c=>c.id===activeId)?.members.find(m=>m!==cu.id);
  const other = DB.users.find(u=>u.id===otherUserId);
  const thread = (activeId && !isNew) ? DB.messages.filter(m=>m.conversationId===activeId).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt)) : [];

  const list = myConvos.map(c=>{
    const oid = c.members.find(m=>m!==cu.id); const ou = DB.users.find(u=>u.id===oid);
    const msgs = DB.messages.filter(m=>m.conversationId===c.id); const last = msgs[msgs.length-1];
    return `<button onclick="UI.messagesActiveId='${c.id}'; render()" class="w-full flex items-center gap-3 px-4 py-3 border-b border-white/[0.04] text-left hover:bg-white/[0.03] transition-colors ${activeId===c.id?"bg-white/[0.05]":""}">
      <div class="relative">${avatarHTML(ou,38)}<span class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-400 ring-2 ring-[#050509]"></span></div>
      <div class="min-w-0 flex-1"><p class="text-sm font-medium truncate">${esc(ou?.name||"")}</p><p class="text-xs text-white/40 truncate">${esc(last?.content || "Say hello 👋")}</p></div>
      ${last?`<span class="text-[10px] text-white/30 shrink-0">${timeAgo(last.createdAt)}</span>`:""}</button>`;
  }).join("");

  const thread_html = other ? `
    <div class="flex items-center gap-3 px-5 py-3.5 border-b border-white/[0.06]">
      <button class="sm:hidden text-white/50" onclick="UI.messagesActiveId=null; render()"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      ${avatarHTML(other,34)}<div><p class="text-sm font-medium">${esc(other.name)}</p><p class="text-[11px] text-emerald-400">Online</p></div></div>
    <div id="msgScroll" class="flex-1 overflow-y-auto px-5 py-4 space-y-3">
      ${thread.length===0?`<p class="text-center text-xs text-white/30 mt-6">Start the conversation with ${esc(other.name.split(" ")[0])}.</p>`:""}
      ${thread.map(m=>{ const mine = m.senderId===cu.id;

    </div>
    <div class="p-4 border-t border-white/[0.06] flex items-center gap-2">
      <input id="msgInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter') sendMessage('${other.id}')" class="ss-input"/>
      ${btn({label:"", icon:"send", onclick:`sendMessage('${other.id}')`})}
    </div>` : `<div class="flex-1 flex items-center justify-center text-white/30 text-sm">Select a conversation</div>`;

  return `<div class="h-[calc(100vh-8.5rem)] lg:h-[calc(100vh-6rem)] -mx-4 sm:-mx-6 lg:-mx-10 -my-6 flex border-t border-white/[0.06]">
    <div class="w-full sm:w-72 shrink-0 border-r border-white/[0.06] overflow-y-auto ${activeId?"hidden sm:block":""}">${list}</div>
    <div class="flex-1 flex flex-col ${!activeId?"hidden sm:flex":""}">${thread_html}</div>
  </div>`;
}
function sendMessage(otherId){
  const cu = currentUser(); const input = document.getElementById("msgInput"); if (!input) return;
  const content = input.value.trim(); if (!content) return;
  let cid = UI.messagesActiveId && !UI.messagesActiveId.startsWith("new:") ? UI.messagesActiveId : null;
  if (!cid){
    const existing = DB.conversations.find(c=>c.members.includes(cu.id) && c.members.includes(otherId));
    if (existing) cid = existing.id;
    else { cid = uid("cv"); DB.conversations.unshift({ id:cid, members:[cu.id, otherId], updatedAt:nowISO() }); }
  }
  const conv = DB.conversations.find(c=>c.id===cid); if (conv) conv.updatedAt = nowISO();
  DB.messages.push({ id:uid("msg"), conversationId:cid, senderId:cu.id, content, createdAt:nowISO() });
  DB.notifications.unshift({ id:uid("ntf"), userId:otherId, text:`New message from ${cu.name}.`, type:"message", read:false, createdAt:nowISO() });
  UI.messagesActiveId = cid;
  render();
  const scroller = document.getElementById("msgScroll"); if (scroller) scroller.scrollTop = scroller.scrollHeight;
}

function revealHomeHero(){
  const hero=document.querySelector(".ss-hero");
  if(!hero || hero.classList.contains("is-intro-revealed")) return;
  const heading=hero.querySelector("h1");
  if(heading){
    heading.setAttribute("aria-label",heading.innerText.replace(/\s+/g," ").trim());
    let charIndex=0;
    heading.querySelectorAll(":scope > span").forEach(line=>{
      const words=line.textContent.trim().split(/\s+/);
      line.setAttribute("aria-hidden","true");
      line.replaceChildren();
      words.forEach((word,wordIndex)=>{
        if(wordIndex) line.append(document.createTextNode(" "));
        const wordWrap=document.createElement("span"); wordWrap.className="ss-type-word";
        Array.from(word).forEach(char=>{
          const letter=document.createElement("span"); letter.className="ss-type-char";
          letter.style.setProperty("--char-delay",`${charIndex++ * 18}ms`); letter.textContent=char; wordWrap.append(letter);
        });
        line.append(wordWrap);
      });
    });
  }
  requestAnimationFrame(()=>hero.classList.add("is-intro-revealed"));
}
function playBrandIntro(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ revealHomeHero(); return; }
  const target=[...document.querySelectorAll("[data-brand-target]")].find(el=>el.getBoundingClientRect().width>0);
  if(!target){ revealHomeHero(); return; }
  const overlay=document.createElement("div"); overlay.className="ss-intro";
  overlay.innerHTML=`<div class="ss-intro-tunnel"></div><div class="ss-intro-flash"></div><div class="ss-intro-brand">${logoHTML(true,80)}</div><div class="ss-intro-caption">Learn more. Teach what you know.</div>`;
  document.body.appendChild(overlay);
  const brand=overlay.querySelector(".ss-intro-brand"), start=brand.getBoundingClientRect(), end=target.getBoundingClientRect();
  const dx=end.left+end.width/2-(start.left+start.width/2), dy=end.top+end.height/2-(start.top+start.height/2), scale=end.width/start.width;
  const duration=2100;
  const tunnel=overlay.querySelector(".ss-intro-tunnel");
  tunnel.animate([
    {transform:"translate(-50%,-50%) scale(.08) rotate(-22deg)",opacity:0},
    {offset:.2,transform:"translate(-50%,-50%) scale(.48) rotate(0deg)",opacity:.8},
    {offset:.72,transform:"translate(-50%,-50%) scale(1.65) rotate(100deg)",opacity:.62},
    {transform:"translate(-50%,-50%) scale(3.4) rotate(190deg)",opacity:0}
  ],{duration,easing:"cubic-bezier(.55,.02,.28,1)",fill:"forwards"});
  const flash=overlay.querySelector(".ss-intro-flash");
  flash.animate([{opacity:0},{offset:.16,opacity:.7},{offset:.28,opacity:0},{offset:.8,opacity:0},{opacity:.32}],{duration,easing:"ease-out",fill:"forwards"});
  brand.animate([
    {transform:"translate(-50%,-50%) scale(.72)",filter:"blur(12px)",opacity:0},
    {offset:.18,transform:"translate(-50%,-50%) scale(1.04)",filter:"blur(0)",opacity:1,easing:"cubic-bezier(.16,1,.3,1)"},
    {offset:.55,transform:"translate(-50%,-50%) scale(1)",filter:"blur(0)",opacity:1},
    {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${scale})`,filter:"blur(0)",opacity:1}
  ],{duration,easing:"cubic-bezier(.76,0,.18,1)",fill:"forwards"});
  const fade=overlay.animate([{opacity:1},{offset:.76,opacity:1},{opacity:0}],{duration:duration+260,easing:"cubic-bezier(.7,0,.3,1)",fill:"forwards"});
  fade.onfinish=()=>{ overlay.remove(); revealHomeHero(); };
}
playBrandIntro();
function startFaviconAnimation(){
  const link=document.getElementById("ss-favicon"); if(!link) return;
  const canvas=document.createElement("canvas"); canvas.width=32; canvas.height=32;
  const ctx=canvas.getContext("2d"); if(!ctx) return;
  let angle=0;
  const draw=()=>{
    ctx.clearRect(0,0,32,32);
    const dx=Math.cos(angle)*4,dy=Math.sin(angle)*4,x1=16-dx,y1=16-dy,x2=16+dx,y2=16+dy;
    const line=ctx.createLinearGradient(x1,y1,x2,y2); line.addColorStop(0,"#7c3aed"); line.addColorStop(1,"#22d3ee");
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=line; ctx.lineWidth=1.5; ctx.lineCap="round"; ctx.stroke();
    ctx.beginPath(); ctx.arc(x1,y1,4.8,0,Math.PI*2); ctx.fillStyle="#7c3aed"; ctx.fill();
    ctx.beginPath(); ctx.arc(x2,y2,4.8,0,Math.PI*2); ctx.fillStyle="#22d3ee"; ctx.fill();
    link.type="image/png"; link.href=canvas.toDataURL("image/png");
  };
  draw();
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches)
    setInterval(()=>{ if(document.hidden) return; angle+=.16; draw(); },250);
}
startFaviconAnimation();
let mouseFrame=0, lastTiltCard=null, lastPointerPaint=0;
document.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse" || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(mouseFrame) return;
  mouseFrame=requestAnimationFrame(()=>{
    mouseFrame=0;
    const now=performance.now();
    if(now-lastPointerPaint>=50){
      document.documentElement.style.setProperty("--pointer-x",`${e.clientX}px`);
      document.documentElement.style.setProperty("--pointer-y",`${e.clientY}px`);
      lastPointerPaint=now;
    }
    const dx=e.clientX-WAVE_MOUSE.x,dy=e.clientY-WAVE_MOUSE.y,speed=Math.hypot(dx,dy);
    if(speed>1 && dx+dy<0){ WAVE_MOUSE.energy=Math.min(1,WAVE_MOUSE.energy+Math.min(speed/90,.35)); WAVE_MOUSE.originX=e.clientX; WAVE_MOUSE.originY=e.clientY; WAVE_MOUSE.lastImpulse=performance.now(); }
    WAVE_MOUSE.x=e.clientX; WAVE_MOUSE.y=e.clientY;
    const card=e.target.closest?.(".ss-tilt");
    if(lastTiltCard && lastTiltCard!==card){ lastTiltCard.style.setProperty("--tilt-x","0deg"); lastTiltCard.style.setProperty("--tilt-y","0deg"); }
    lastTiltCard=card;
    if(card){ const r=card.getBoundingClientRect(); card.style.setProperty("--tilt-x",`${((e.clientX-r.left)/r.width-.5)*7}deg`); card.style.setProperty("--tilt-y",`${(.5-(e.clientY-r.top)/r.height)*7}deg`); }
  });
},{passive:true});
document.addEventListener("pointerout",e=>{
  if(e.pointerType!=="mouse") return;
  if(!e.relatedTarget){ document.documentElement.style.setProperty("--pointer-x","50%"); document.documentElement.style.setProperty("--pointer-y","35%"); }
  const card=e.target.closest?.(".ss-tilt");
  if(card && !card.contains(e.relatedTarget)){ card.style.setProperty("--tilt-x","0deg"); card.style.setProperty("--tilt-y","0deg"); if(lastTiltCard===card) lastTiltCard=null; }
},{passive:true});
if(ssClient){
  ssClient.auth.getSession().then(async({data})=>{ if(data.session) try{ await syncProfile(data.session.user); }catch(e){toast("Could not load your server profile: "+e.message,"error");} });
}
